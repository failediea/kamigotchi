[profile.default]
ffi = false
libs = ["../../node_modules", "node_modules"]
optimizer = true
optimizer_runs = 1000000
out = "out"
solc = "0.8.28"
src = "src"
verbosity = 1
gas_reports = ["*"]
memory_limit = 43554432


[profile.build]
optimizer = false

[profile.build.fuzz]
runs = 128

# The v14 renter-funded market must compile through IR to stay below the
# EIP-170 runtime bytecode limit. This matches the production deployment.
[profile.v14]
via_ir = true
optimizer = true
optimizer_runs = 200
out = "out-v14"

# The post-v16 vault hardening release is byte-constrained: both the market and
# renter factory sit immediately below EIP-170 only with the size-oriented run
# count. Deployment must use this profile exactly.
[profile.v17]
via_ir = true
optimizer = true
optimizer_runs = 1
out = "out-v17"
